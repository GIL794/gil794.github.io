<!-- Button component with Liquid parameters -->
<!-- Usage: {% include button.html text="Click Me" link="/page" color="primary" size="medium" %} -->

{% assign btn_text = include.text | default: "Button" %}
{% assign btn_link = include.link | default: "#" %}
{% assign btn_color = include.color | default: "primary" %}
{% assign btn_size = include.size | default: "medium" %}

<a href="{{ btn_link }}" class="btn btn-{{ btn_color }} btn-{{ btn_size }}">
  {{ btn_text }}
</a>
